<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLY — Seat Selection</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <div class="brand-wrapper" onclick="window.location.href='/'">
        <img src="/images/fly_icon.svg" alt="FLY Logo" class="brand-logo-img">
        <div class="brand-text">
          <span class="brand-title">FLY</span>
          <span class="brand-sub">Seat Selection</span>
        </div>
      </div>
      <nav class="nav-links">
        <a href="/" class="nav-btn">Home</a>
        <a href="/my-bookings" class="nav-btn">My Bookings</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 32px; padding-bottom: 60px;">
    <div class="card glassmorphism" style="padding: 24px; margin-bottom: 24px;">
      <h2>Interactive Aircraft Seat Map</h2>
      <p style="color: var(--text-secondary); margin-top: 8px;">
        Select your seats and click "Hold Selected Seats" to lock them for 15 minutes.
      </p>
    </div>

    <!-- Aircraft Fuselage Container -->
    <div class="aircraft-container">
      <div class="aircraft-nose">
        <div class="cockpit-window"></div>
      </div>
      <div class="cabin-fuselage">
        <div id="seatMapGrid" class="seat-map-grid">
          <!-- Populated by seat_selection.js -->
          <div style="text-align: center; padding: 40px; color: var(--text-muted);">
            Loading seat configuration...
          </div>
        </div>
      </div>
    </div>

    <!-- Seat Hold Action Bar -->
    <div class="glassmorphism" style="margin-top: 24px; padding: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
      <div>
        <span style="font-weight: 700;">Selected Seats:</span>
        <span id="selectedSeatsLabel" style="font-weight: 800; color: var(--accent-primary); margin-left: 8px;">None</span>
      </div>
      <button id="btnHoldSeats" class="btn-primary" onclick="seatSelectionModule.holdSeats()">
        Hold Selected Seats (15-Min Lock)
      </button>
    </div>
  </main>

  <script src="/js/seat_selection.js"></script>
</body>
</html>
