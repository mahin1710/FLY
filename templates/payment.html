<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLY — Confirm Payment Checkout</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <div class="brand-wrapper" onclick="window.location.href='/'">
        <img src="/images/fly_icon.svg" alt="FLY Logo" class="brand-logo-img">
        <div class="brand-text">
          <span class="brand-title">FLY</span>
          <span class="brand-sub">Checkout & Payment</span>
        </div>
      </div>
      <nav class="nav-links">
        <a href="/" class="nav-btn">Home</a>
        <a href="/my-bookings" class="nav-btn">My Bookings</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 32px; padding-bottom: 60px; max-width: 680px;">
    <div class="modal-box glassmorphism" style="margin: 0 auto;">
      <h3 class="modal-title">Complete Reservation & Payment</h3>

      <div class="payment-timer-box" id="paymentTimerBox" style="margin: 16px 0;">
        <div class="timer-badge">
          <span class="pulse-amber-dot"></span>
          <span>Temporary Seat Hold Active</span>
        </div>
        <div class="timer-digits-row">
          <span class="timer-clock-icon">⏱️</span>
          <span class="timer-digits" id="paymentTimerClock">15:00</span>
          <span class="timer-unit">REMAINING</span>
        </div>
      </div>

      <div id="checkoutSummaryCard" style="background: var(--bg-surface-elevated); padding: 18px; border-radius: var(--radius-md); margin-bottom: 20px;">
        <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 8px;">Booking Reference: <span id="summaryBookingRef">...</span></div>
        <div style="color: var(--text-secondary); font-size: 0.9rem;" id="summaryRoute">Loading details...</div>
        <div style="margin-top: 12px; font-weight: 800; font-size: 1.25rem; color: var(--accent-primary);" id="summaryTotal">Total: ৳0</div>
      </div>

      <div style="display: flex; gap: 12px; flex-direction: column;">
        <button class="btn-primary btn-large" id="btnInstantPay" onclick="paymentModule.confirmPayment('TEST_MODE')">
          ⚡ Instant Verify & Pay (Test Mode)
        </button>
        <button class="btn-secondary" onclick="window.location.href='/my-bookings'">
          Back to My Bookings
        </button>
      </div>
    </div>
  </main>

  <script src="/js/payment.js"></script>
</body>
</html>
