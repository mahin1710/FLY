{# Reusable Loading State Component #}
{% macro render_loading_state(message='Loading flight data, please wait...', show_skeleton=True) %}
<div class="loading-state-card glassmorphism" role="status" aria-live="polite">
  <div class="loading-spinner-wrapper">
    <div class="loading-spinner"></div>
  </div>
  <p class="loading-state-text">{{ message }}</p>
  {% if show_skeleton %}
    <div class="skeleton-wrapper" aria-hidden="true">
      <div class="skeleton-line skeleton-title"></div>
      <div class="skeleton-line skeleton-subtitle"></div>
      <div class="skeleton-grid">
        <div class="skeleton-box"></div>
        <div class="skeleton-box"></div>
        <div class="skeleton-box"></div>
      </div>
    </div>
  {% endif %}
</div>
{% endmacro %}
