<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="flyGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <linearGradient id="flyGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="flyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle/shield subtle container -->
  <rect width="64" height="64" rx="16" fill="#0f172a" />
  <!-- Dynamic Aviation Wings -->
  <g transform="translate(6, 6)" filter="url(#flyGlow)">
    <!-- Rear aerodynamic blade -->
    <path d="M 6 42 L 24 14 L 30 18 L 16 42 Z" fill="url(#flyGrad2)" opacity="0.85" />
    <!-- Main ascending delta wing -->
    <path d="M 17 42 L 36 6 L 46 12 L 31 42 Z" fill="url(#flyGrad1)" />
    <!-- Supersonic jet nose / forward winglet -->
    <path d="M 33 42 L 47 19 L 51 22 L 41 42 Z" fill="#00e5ff" />
    <!-- Contrail speed dot -->
    <circle cx="10" cy="42" r="2.5" fill="#38bdf8" />
  </g>
</svg>
