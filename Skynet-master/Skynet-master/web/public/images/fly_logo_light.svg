<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64">
  <defs>
    <linearGradient id="flyGradLight1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="flyGradLight2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <!-- Aviation Wing Monogram Symbol -->
  <g transform="translate(6, 6)">
    <!-- Rear sweep blade -->
    <path d="M 6 42 L 24 14 L 30 18 L 16 42 Z" fill="url(#flyGradLight2)" opacity="0.9" />
    <!-- Main ascending delta wing -->
    <path d="M 17 42 L 36 6 L 46 12 L 31 42 Z" fill="url(#flyGradLight1)" />
    <!-- Forward supersonic winglet -->
    <path d="M 33 42 L 47 19 L 51 22 L 41 42 Z" fill="#0284c7" />
    <circle cx="10" cy="42" r="2.5" fill="#0284c7" />
  </g>

  <!-- Brand Wordmark FLY for Light Background -->
  <g transform="translate(70, 0)">
    <text x="0" y="44" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" letter-spacing="4" fill="#0f172a">FLY</text>
    <text x="2" y="57" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="3" fill="#0284c7">AVIATION &amp; TRAVEL</text>
  </g>
</svg>
