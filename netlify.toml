# Netlify Configuration for FLY Flight Booking Platform
# Author: mahin1710

[build]
  publish = "Skynet-master/Skynet-master/web/public"
  functions = "netlify/functions"
  command = "npm --prefix Skynet-master/Skynet-master/web install"

[build.environment]
  NODE_VERSION = "22"

[functions]
  included_files = ["Skynet-master/Skynet-master/web/database.db"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
